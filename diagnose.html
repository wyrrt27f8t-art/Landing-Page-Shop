<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Diagnose Kartenzahlung</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #15110c; color: #f3ede1; margin: 0; padding: 20px; max-width: 640px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .zeile { padding: 10px 12px; margin: 8px 0; border-radius: 8px; background: #221c14; border-left: 4px solid #8a8272; }
    .ok { border-left-color: #6bbf6b; } .nein { border-left-color: #e0705a; }
    small { color: #ab9f8c; display: block; margin-top: 2px; word-break: break-all; }
    pre { white-space: pre-wrap; word-break: break-all; background: #221c14; padding: 12px; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Diagnose Kartenzahlung</h1>
  <p>Diese Seite prüft in wenigen Sekunden, wo es hakt. Bitte mach einen Screenshot der ganzen Seite.</p>
  <div id="ergebnis"></div>
  <pre id="roh"></pre>
  <iframe id="kasse" src="/kasse.html" style="position:absolute;width:1px;height:1px;opacity:0;border:0" title=""></iframe>
  <script>
    const ausgabe = document.getElementById("ergebnis");
    const roh = [];
    const zeile = (ok, text, detail) => {
      const d = document.createElement("div");
      d.className = "zeile " + (ok === true ? "ok" : ok === false ? "nein" : "");
      d.textContent = (ok === true ? "OK  " : ok === false ? "FEHLT  " : "") + text;
      if (detail) { const s = document.createElement("small"); s.textContent = detail; d.append(s); }
      ausgabe.append(d);
      roh.push((ok === true ? "OK" : ok === false ? "FEHLT" : "--") + " " + text + (detail ? " | " + detail : ""));
    };
    const kopf = (r) => ["server", "age", "x-vercel-cache", "cf-cache-status", "cache-control", "etag"].map((n) => n + "=" + (r.headers.get(n) || "-")).join("  ");

    (async () => {
      // 1. Antwort der Schnittstelle
      try {
        const r = await fetch("/api/zahlarten?t=" + Date.now(), { cache: "no-store" });
        const t = await r.text();
        zeile(r.ok && /"karte":true/.test(t), "Schnittstelle meldet Karte bereit", "Status " + r.status + ", Antwort " + t.trim());
      } catch (e) { zeile(false, "Schnittstelle nicht erreichbar", String(e)); }

      // 2. Welches Skript liefert die Website aus?
      try {
        const r = await fetch("/script.js?v=20261009", { cache: "no-store" });
        const t = await r.text();
        zeile(t.includes("api/zahlarten") && t.includes("mafoKarte"), "Skript enthält den neuesten Karten-Code", "Länge " + t.length + " Zeichen; " + kopf(r));
      } catch (e) { zeile(false, "Skript nicht ladbar", String(e)); }

      // 3. Welche Kasse-Seite liefert die Website aus?
      try {
        const r = await fetch("/kasse.html", { cache: "no-store" });
        const t = await r.text();
        zeile(t.includes('id="zahlart-karte"'), "Kasse-Seite enthält die Option Karte", kopf(r));
        zeile(t.includes("script.js?v=20261009"), "Kasse-Seite lädt das Skript mit Versionsnummer");
      } catch (e) { zeile(false, "Kasse-Seite nicht ladbar", String(e)); }

      // 4. Die echte Kasse laden und schauen, was das Skript dort getan hat
      const rahmen = document.getElementById("kasse");
      const pruefeRahmen = () => {
        try {
          const w = rahmen.contentWindow, o = w.document.getElementById("zahlart-karte");
          const k = w.mafoKarte;
          if (!k) return zeile(false, "Das Skript der Kasse hat die Abfrage gar nicht gestartet", "Fehler im Skript oder altes Skript");
          zeile(k.stand === "angezeigt" && o && !o.hidden, "Die Kasse blendet die Option Karte ein", "Zustand: " + k.stand + (k.http ? ", HTTP " + k.http : "") + (k.meldung ? ", Meldung: " + k.meldung : ""));
        } catch (e) { zeile(false, "Kasse im Test nicht lesbar", String(e)); }
        zeile(null, "Gerät", navigator.userAgent);
        document.getElementById("roh").textContent = roh.join("\n");
      };
      const bereit = () => setTimeout(pruefeRahmen, 2500);
      if (rahmen.contentDocument && rahmen.contentDocument.readyState === "complete") bereit(); else rahmen.addEventListener("load", bereit);
    })();
  </script>
</body>
</html>
